<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    fetch('/index.html')
      .then(response => response.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        document.body.innerHTML = '<h2>404</h2><p>Failed to load site.</p>';
      });
  </script>
</head>
<body>
</body>
</html>
