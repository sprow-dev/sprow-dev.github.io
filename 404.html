<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // who came up with trailing slashes. please tell me so I can... nevermind
    var pathname = window.location.pathname;
    if (pathname.length > 1 && pathname.endsWith('/')) {
      pathname = pathname.slice(0, -1);
      history.replaceState(null, '', pathname + window.location.search + window.location.hash);
    }

    fetch('/index.html')
      .then(response => response.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        document.body.innerHTML = '<h2>404</h2><p>Failed to load site.</p>';
      });
  </script>
</head>
<body>
</body>
</html>
