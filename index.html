<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sprow.dev</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
<article>
    <header>
        <nav class="navbar">
            <button class="nav button" data-route="/">Home</button>
            <button class="nav button" data-route="/tools">Tools</button>
        </nav>
        <center>
            <h1>sprow.dev</h1>
        </center>
    </header>

    <main id="app"></main>

    <footer>
        <p>&copy;2025 <a href="/" data-route="/">sprow.dev</a>. <a href="/license" data-route="/license">License</a></p>
    </footer>
</article>

<script>
var routes = {
    '/':                    '/home.html',
    '/tools':               '/tools.html',
    '/license':             '/license.html',
    '/tools/ytobf':         '/tools/ytobf/ytobf.html',
    '/tools/1':             '/tools/ytobf/redirect.html',
    '/games/tictactoe':     '/games/tictactoe/index.html',
    '/games/tictactoe/offline': '/games/tictactoe/game-offline.html',
    '/games/tictactoe/online':  '/games/tictactoe/game-online.html',
};

function injectHTML(parent, html) {
    var temp = document.createElement('div');
    temp.innerHTML = html;

    /* pull out every <script> at any depth so they can be re-created */
    var scripts = [];
    var cursor = temp.firstChild;
    while (cursor) {
        var next = cursor.nextSibling;
        if (cursor.nodeType === 1 && cursor.tagName === 'SCRIPT') {
            scripts.push(cursor);
            temp.removeChild(cursor);
        } else if (cursor.nodeType === 1) {
            collectScripts(cursor, scripts);
        }
        cursor = next;
    }

    parent.innerHTML = '';
    while (temp.firstChild) parent.appendChild(temp.removeChild(temp.firstChild));

    for (var i = 0; i < scripts.length; i++) {
        var s = document.createElement('script');
        if (scripts[i].getAttribute('src')) s.src = scripts[i].getAttribute('src');
        s.textContent = scripts[i].textContent;
        parent.appendChild(s);
    }
}

function collectScripts(node, out) {
    var cursor = node.firstChild;
    while (cursor) {
        var next = cursor.nextSibling;
        if (cursor.nodeType === 1 && cursor.tagName === 'SCRIPT') {
            out.push(cursor);
            node.removeChild(cursor);
        } else if (cursor.nodeType === 1) {
            collectScripts(cursor, out);
        }
        cursor = next;
    }
}

async function navigate(path) {
    var basePath = path.split('?', 2)[0];
    var file = routes[basePath] || routes['/'];

    try {
        var res = await fetch(file);
        if (!res.ok) throw new Error('Page not found');
        injectHTML(document.getElementById('app'), await res.text());

        if (window.location.pathname + window.location.search !== path)
            history.pushState({ path: path }, '', path);
    } catch (_) {
        document.getElementById('app').innerHTML =
            '<h2>404</h2><p>Page not found.</p>';
    }
}

document.addEventListener('click', function(e) {
    var t = e.target.closest('[data-route]');
    if (!t) return;
    var p = t.getAttribute('data-route');
    if (p) { e.preventDefault(); navigate(p); }
});

window.addEventListener('popstate', function() {
    navigate(window.location.pathname + window.location.search);
});

document.addEventListener('DOMContentLoaded', function() {
    navigate(window.location.pathname + window.location.search);
});
</script>
<script src="tools.js"></script>
</body>
</html>
